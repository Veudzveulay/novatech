server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de health check utilisé par le stage Staging du pipeline
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # En staging on autorise l'inspection (headers debug), pas d'indexation
    add_header X-Robots-Tag "noindex, nofollow" always;
}
