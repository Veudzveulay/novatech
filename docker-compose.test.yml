# Base PostgreSQL jetable pour les tests d'intégration (L2 uniquement).
# Ce fichier ne couvre QUE la base de test : le docker-compose applicatif des
# 4 services relève du L1 (Dockerfiles multi-stage).
services:
  postgres-test:
    image: postgres:15-alpine
    container_name: hrflow-postgres-test
    environment:
      POSTGRES_USER: hrflow_test
      POSTGRES_PASSWORD: hrflow_test
      POSTGRES_DB: hrflow_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow_test -d hrflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
