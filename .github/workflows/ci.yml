name: ShipIt CI — Stage 1 (Build & Lint & Type-check)

# Déclenchement : sur toute PR vers main (gate obligatoire, cf. docs/02-strategie-git.md)
# et sur push direct sur main réservé aux merges de PR déjà validées.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule les runs redondants si de nouveaux commits arrivent sur la même PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: novatech-sas

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : Lint + Type-check — exécuté en parallèle pour chaque service
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type-check (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - front
          - api-gateway
          - service-paie
          - service-conges
          - service-recrutement

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Installation des dépendances
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Lint (ESLint)
        working-directory: services/${{ matrix.service }}
        run: npm run lint

      - name: Type-check
        working-directory: services/${{ matrix.service }}
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Job 2 : Build des images Docker — ne se lance que si le lint/type-check passe
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - front
          - api-gateway
          - service-paie
          - service-conges
          - service-recrutement

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image Docker (target=prod)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/${{ matrix.service }}
          file: ./docker/${{ matrix.service }}/Dockerfile
          target: prod
          push: false
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Push de l'image (uniquement sur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/${{ matrix.service }}
          file: ./docker/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Job récapitulatif : point d'entrée unique à référencer dans la règle de
  # protection de branche "main" (statut requis avant merge).
  # ---------------------------------------------------------------------------
  stage-1-status:
    name: Stage 1 — Build OK
    needs: [lint-and-typecheck, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 validé
        run: echo "✅ Lint, type-check et build Docker OK pour les 5 unités déployables."

# ------------------------------------------------------------------------------
# NOTE J1 : les stages Test (Jest/Playwright/coverage), Security (Trivy/ZAP),
# Staging et Production seront ajoutés dans ce même fichier au fil des
# livrables J2/J3 (cf. docs/01-architecture-pipeline.md). Ce fichier ne
# contient volontairement à ce stade que le Stage 1, conformément au
# périmètre du Livrable J1.
# ------------------------------------------------------------------------------
