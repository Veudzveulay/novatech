name: ShipIt CI — Stage 1 (Build & Lint & Type-check)

on:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: novatech-sas

jobs:
  lint-and-typecheck:
    name: Lint & Type-check (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front
            workspace: frontend
            lockfile: frontend/package-lock.json

          - service: api-gateway
            workspace: services/api-gateway
            lockfile: services/api-gateway/package-lock.json

          - service: auth
            workspace: services/auth
            lockfile: services/auth/package-lock.json

          - service: service-paie
            workspace: services/paie
            lockfile: services/paie/package-lock.json

          - service: service-conges
            workspace: services/conges
            lockfile: services/conges/package-lock.json

          - service: service-recrutement
            workspace: services/recrutement
            lockfile: services/recrutement/package-lock.json

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Installation des dépendances
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "Aucun script lint défini pour ${{ matrix.service }} — étape ignorée."
          fi

      - name: Type-check
        working-directory: ${{ matrix.workspace }}
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "Aucun script typecheck défini pour ${{ matrix.service }} — étape ignorée."
          fi

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front
            dockerfile: frontend/Dockerfile
            context: frontend

          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: services/api-gateway

          - service: auth
            dockerfile: services/auth/Dockerfile
            context: services/auth

          - service: service-paie
            dockerfile: services/paie/Dockerfile
            context: services/paie

          - service: service-conges
            dockerfile: services/conges/Dockerfile
            context: services/conges

          - service: service-recrutement
            dockerfile: services/recrutement/Dockerfile
            context: services/recrutement

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Push de l'image sur main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  stage-1-status:
    name: Stage 1 — Build OK
    needs:
      - lint-and-typecheck
      - docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 validé
        run: echo "Lint, type-check et build Docker OK pour les unités déployables."
